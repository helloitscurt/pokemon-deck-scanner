server {
    listen 80;
    server_name _;
    client_max_body_size 500M;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    # script-src needs 'wasm-unsafe-eval' (WebAssembly.instantiate, used by
    # the vendored OpenCV.js) and 'unsafe-eval' (Emscripten's embind glue
    # code calls `new Function(...)` to build C++ class wrappers, e.g. for
    # jscanify's cv.Mat usage) — without both, WASM compilation/glue-code
    # execution is silently blocked, logged only to devtools console, never
    # surfaced to the page. See frontend/public/opencv/VENDORED.md.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://assets.tcgdex.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com data: blob:; connect-src 'self' https://api.tcgdex.net https://api.frankfurter.app https://api.github.com https://raw.githubusercontent.com https://generativelanguage.googleapis.com" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # SPA entry point: must always revalidate, never heuristically cache —
    # unlike the hashed JS/CSS it references (immutable below), this file's
    # content changes on every deploy but keeps the same filename. Verified
    # it previously had no Cache-Control header at all (only Last-Modified/
    # ETag), which is exactly what invites a browser's own heuristic
    # freshness caching (RFC 7234) — a real-device debug message not
    # matching code that had actually been deployed several rebuilds
    # earlier is what surfaced this: the phone was silently still loading
    # an old build's index.html, which still pointed at an old JS bundle
    # hash. try_files below internally redirects to /index.html, which
    # re-enters nginx's location matching, so this exact-match block covers
    # every SPA route, not just literal /index.html requests.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vendored OpenCV/jscanify build: large static files at fixed, unhashed
    # filenames. A network-interrupted fetch can't be told apart from a good
    # one by the browser, so immutable long-lived caching would let a
    # truncated download get stuck in cache forever. Must-revalidate instead.
    location ^~ /opencv/ {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
