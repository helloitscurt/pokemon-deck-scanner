name: Backend Tests

on:
  pull_request:
    paths:
      - backend/**
      - CONTRIBUTING.md
      - .github/workflows/backend-tests.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - CONTRIBUTING.md
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}" fetch --force origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Show Python toolchain
        run: |
          python --version
          pip --version

      - name: Install dependencies
        # No --no-cache-dir here: actions/setup-python's cache: "pip" above
        # needs pip to actually populate ~/.cache/pip to have anything to
        # save for the next run — --no-cache-dir defeated that entirely and
        # made the cache-save post-step fail (nothing there to save), which
        # marked the whole job red even though the tests themselves passed.
        run: pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m unittest discover -s tests -p "test_*.py"
